name: Public contract informational check

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  public-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install --disable-pip-version-check --no-cache-dir PyYAML==6.0.2
      - run: scripts/verify-public-contract.sh
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          EVIDENCE_OUTPUT: public-contract-evidence.json
